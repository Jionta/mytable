<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in · GROW</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/login.css">
  <script src="/actions.js" defer></script><script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand"><span class="brand-mark">G</span><strong>GROW</strong></div>
    <p class="eyebrow">Your business workspace</p>
    <h1>A clear place to grow.</h1>
    <p class="muted">Sign in to manage your businesses, review content, and keep work moving.</p>
    <form id="login-form">
      <div class="form-row"><label for="email">Collaborator email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="Owner: leave this empty"><small class="muted">Added to a business? Use the email on your invitation.</small></div><div class="form-row"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus></div>
      <p id="login-error" role="alert" hidden></p>
      <button class="btn primary" type="submit">Open workspace</button>
    </form>
    <p class="login-footer">Private workspace · Jubayer</p>
  </main>
</body>
</html>
